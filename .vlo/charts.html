llipop-dot{position:absolute;left:50%;width:10px;height:10px;background:var(--chart-color,#00f5ff);border-radius:50%;transform:translate(-50%,50%)} .vlo-lollipop-label{width:100%;font-size:10px;color:#777;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .vlo-chart-pie{width:100%;max-width:600px;margin:0 auto;font-family:system-ui,-apple-system,sans-serif;} .vlo-chart-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,0.1);} .vlo-chart-title{margin:0;font-size:1.1rem;font-weight:600;color:#fff;} .vlo-chart-summary{display:flex;gap:20px;} .vlo-chart-stat{display:flex;flex-direction:column;align-items:flex-end;} .vlo-chart-stat-label{font-size:0.75rem;color:#888;text-transform:uppercase;letter-spacing:0.05em;} .vlo-chart-stat-value{font-size:1.1rem;font-weight:700;color:#00f5ff;} .vlo-pie-body{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center;} .vlo-pie-visual{display:flex;justify-content:center;align-items:center;width:100%;} .vlo-pie-svg{width:100%;max-width:300px;height:auto;aspect-ratio:1 / 1;display:block;overflow:visible;} .vlo-pie-slice{stroke:#1a1a2e;stroke-width:2px;transition:opacity 0.2s ease,transform 0.2s ease;cursor:pointer;transform-origin:center;} .vlo-pie-slice:hover{opacity:0.85;transform:scale(1.03);} .vlo-pie-legend{display:flex;flex-direction:column;gap:12px;} .vlo-pie-legend-item{display:flex;align-items:center;gap:12px;font-size:0.85rem;padding:8px 12px;border-radius:8px;transition:background 0.2s;} .vlo-pie-legend-item:hover{background:rgba(255,255,255,0.05);} .vlo-pie-legend-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px currentColor;} .vlo-pie-legend-label{flex:1;color:#ccc;} .vlo-pie-legend-value{font-weight:600;color:#fff;font-variant-numeric:tabular-nums;} .vlo-chart-empty{text-align:center;padding:40px 20px;color:#666;font-size:0.9rem;} @media (max-width:600px){.vlo-pie-body{grid-template-columns:1fr;} .vlo-chart-header{flex-direction:column;gap:16px;} .vlo-chart-summary{width:100%;justify-content:space-between;}} .vlo-chart-empty{display:flex;align-items:center;justify-content:center;height:200px;color:#666;font-size:14px} .vlo-chart-empty p{margin:0} @media(max-width:768px){.vlo-chart-header{flex-direction:column;align-items:flex-start} .vlo-chart-summary{width:100%;justify-content:flex-start} .vlo-chart-body{gap:8px;height:180px} .vlo-chart-line-body{flex-direction:column;align-items:stretch;gap:0;height:220px;padding:0} .vlo-line-svg{height:190px} .vlo-line-labels{flex-direction:row;height:30px;margin:0;padding:8px 6px 0} .vlo-bar-track{height:140px} .vlo-bar-value,.vlo-bar-label{font-size:10px}} @media(max-width:480px){.vlo-chart{padding:16px} .vlo-chart-body{height:150px} .vlo-chart-line-body{height:190px} .vlo-line-svg{height:160px} .vlo-line-labels{height:30px;padding:8px 4px 0} .vlo-bar-track{height:110px}}

<script>
document.addEventListener('DOMContentLoaded', () => {
    const palette = ["#00f5ff", "#00ff88", "#ff6680", "#a78bfa", "#f472b6", "#ffaa00", "#06b6d4", "#84cc16"];

    // --- PIE CHART LOGIC ---
    document.querySelectorAll('.vlo-pie-svg').forEach(svg => {
        const slices = Array.from(svg.querySelectorAll('.vlo-pie-slice'));
        if (slices.length === 0) return;

        const total = slices.reduce((sum, slice) => sum + parseFloat(slice.dataset.value || 0), 0);
        let cumulativeAngle = 0;
        const cx = 100, cy = 100, radius = 80;

        slices.forEach((slice, i) => {
            const value = parseFloat(slice.dataset.value || 0);
            const sliceAngle = total > 0 ? (value / total) * 360 : 0;
            
            const startAngle = cumulativeAngle;
            const endAngle = cumulativeAngle + sliceAngle;
            cumulativeAngle = endAngle;

            const startRad = (startAngle - 90) * Math.PI / 180;
            const endRad = (endAngle - 90) * Math.PI / 180;

            const x1 = cx + radius * Math.cos(startRad);
            const y1 = cy + radius * Math.sin(startRad);
            const x2 = cx + radius * Math.cos(endRad);
            const y2 = cy + radius * Math.sin(endRad);

            const largeArc = sliceAngle > 180 ? 1 : 0;
            const path = sliceAngle >= 359.99 
                ? `M ${cx} ${cy} m -${radius} 0 a ${radius} ${radius} 0 1 1 ${radius * 2} 0 a ${radius} ${radius} 0 1 1 -${radius * 2} 0 Z`
                : `M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`;

            slice.setAttribute('d', path);
            slice.setAttribute('fill', palette[i % palette.length]);
            slice.classList.add('vlo-pie-slice-animated');
        });

        const legend = svg.closest('.vlo-chart-pie')?.querySelector('.vlo-pie-legend');
        if (legend) {
            Array.from(legend.querySelectorAll('.vlo-pie-legend-item')).forEach((item, i) => {
                const dot = item.querySelector('.vlo-pie-legend-dot');
                if (dot) dot.style.background = palette[i % palette.length];
            });
        }
    });

    // --- LINE CHART LOGIC ---
    document.querySelectorAll('.vlo-line-svg').forEach(svg => {
        const points = Array.from(svg.querySelectorAll('.vlo-line-point'));
        if (points.length === 0) return;

        const values = points.map(p => parseFloat(p.dataset.value || 0));
        const max = Math.max(...values, 1); // Avoid division by zero
        const len = points.length;
        const pathPoints = [];

        points.forEach((point, i) => {
            // Calculate X (spread across 380px with 10px padding)
            const x = len > 1 ? (i / (len - 1)) * 380 + 10 : 200;
            // Calculate Y (inverted: 190 is bottom, 10 is top)
            const y = 190 - (values[i] / max) * 180;
            
            point.setAttribute('cx', x);
            point.setAttribute('cy', y);
            pathPoints.push(`${x} ${y}`);
        });

        // Draw the connecting line
        const path = svg.querySelector('.vlo-line-path');
        if (path && pathPoints.length > 0) {
            const d = pathPoints.length === 1 
                ? `M ${pathPoints[0]}` 
                : `M ${pathPoints[0]} L ${pathPoints.slice(1).join(' L ')}`;
            path.setAttribute('d', d);
        }
    });
});
</script>
