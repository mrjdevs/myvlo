<style>
.not-found-container{text-align:center;padding:100px 20px;max-width:600px;margin:0 auto;} .glow-code{font-size:7.5rem;font-weight:800;line-height:1;background:linear-gradient(135deg,#00f5ff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:1rem;filter:drop-shadow(0 0 25px rgba(0,245,255,0.3));} .not-found-container h2{font-size:2rem;color:#fff;margin-bottom:12px;} .not-found-container p{color:#888;margin-bottom:30px;font-size:1.1rem;} .vlo-btn{background:#00f5ff;color:#000;padding:12px 24px;border-radius:8px;font-weight:bold;border:none;display:inline-block;text-align:center;cursor:pointer;transition:all 0.2s}.vlo-btn:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(0,245,255,.3)}.vlo-btn.secondary{background:transparent;color:#00f5ff;border:2px solid #00f5ff}.vlo-btn.ghost{background:transparent;color:#aaa} .navbar{width:100%;box-sizing:border-box;color:#a0a0a0;background:var(--background);border-bottom:1px solid var(--border);z-index:100;} .navbar-inner{width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:1.5rem;padding:1rem 2rem;} .brand{color:var(--primary);text-decoration:none;font-weight:700;font-size:1.5rem;line-height:1;white-space:nowrap;transition:opacity .2s ease;} .brand:hover{opacity:.8;} .nav-links{display:flex;align-items:center;justify-content:flex-end;gap:.5rem;} .nav-links a{display:inline-block;color:#a0a0a0;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 16px;text-decoration:none;font-weight:600;transition:color .2s ease,background .2s ease,border-color .2s ease;} .nav-links a:hover{color:#fff;background:rgba(255,255,255,.06);} .nav-links a.active{color:var(--primary);background:rgba(0,245,255,.08);border-color:rgba(0,245,255,.4);} .nav-links a.active:hover{color:#fff;background:rgba(0,245,255,.14);} .navbar.default{background:var(--background);} .navbar.light{background:#fff;color:#374151;border-color:#e5e7eb;} .navbar.light .brand{color:#111827;} .navbar.light .nav-links a{color:#4b5563;} .navbar.light .nav-links a:hover{color:#111827;background:#f3f4f6;} .navbar.light .nav-links a.active{color:var(--primary);background:rgba(0,0,0,.05);border-color:#d1d5db;} .navbar.dark{background:#111827;border-color:#374151;} .navbar.dark .brand{color:#fff;} .navbar.dark .nav-links a{color:#d1d5db;} .navbar.dark .nav-links a:hover{color:#fff;background:#1f2937;} .navbar.dark .nav-links a.active{color:#fff;background:#374151;border-color:#6b7280;} .navbar.primary{background:var(--primary);border-color:transparent;} .navbar.primary .brand{color:#fff;} .navbar.primary .nav-links a{color:rgba(255,255,255,.85);} .navbar.primary .nav-links a:hover{color:#fff;background:rgba(255,255,255,.12);} .navbar.primary .nav-links a.active{color:var(--primary);background:#fff;border-color:#fff;} .navbar.outline{background:transparent;} .navbar.outline .nav-links a{color:var(--primary);} .navbar.outline .nav-links a:hover{color:var(--primary);background:rgba(0,0,0,.03);border-color:var(--primary);} .navbar.outline .nav-links a.active{color:var(--primary);background:transparent;border-color:var(--primary);} .navbar.small .navbar-inner{padding:.65rem 1.25rem;} .navbar.small .brand{font-size:1.25rem;} .navbar.small .nav-links a{padding:6px 10px;font-size:.85rem;} .navbar.large .navbar-inner{padding:1.25rem 2.5rem;} .navbar.large .brand{font-size:1.7rem;} .navbar.large .nav-links a{padding:10px 18px;} .navbar.shadow-small{box-shadow:0 2px 8px rgba(0,0,0,.08);} .navbar.shadow-medium{box-shadow:0 4px 16px rgba(0,0,0,.12);} .navbar.shadow-large{box-shadow:0 8px 30px rgba(0,0,0,.18);} .navbar.sticky{position:sticky;top:0;} .navbar-toggle-input{position:absolute;opacity:0;pointer-events:none;} .navbar-toggle{display:none;width:40px;height:40px;box-sizing:border-box;padding:8px;border:1px solid var(--border);border-radius:7px;cursor:pointer;} .navbar-toggle span{display:block;height:2px;margin:5px 0;background:currentColor;border-radius:2px;transition:transform .2s ease,opacity .2s ease;} @media (max-width:768px){.navbar.collapse .navbar-inner{flex-wrap:wrap;} .navbar.collapse .navbar-toggle{display:block;} .navbar.collapse .nav-links{display:none;width:100%;flex-direction:column;align-items:stretch;padding-top:.5rem;} .navbar.collapse .navbar-toggle-input:checked ~ .navbar-inner .nav-links{display:flex;} .navbar.collapse .nav-links a{width:100%;box-sizing:border-box;} .navbar.collapse .navbar-toggle-input:checked ~ .navbar-inner .navbar-toggle span:nth-child(1){transform:translateY(7px) rotate(45deg);} .navbar.collapse .navbar-toggle-input:checked ~ .navbar-inner .navbar-toggle span:nth-child(2){opacity:0;} .navbar.collapse .navbar-toggle-input:checked ~ .navbar-inner .navbar-toggle span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}} @media (max-width:768px){.navbar.wrap .navbar-inner{flex-wrap:wrap;} .navbar.wrap .nav-links{width:100%;flex-wrap:wrap;justify-content:flex-start;}} @media (max-width:768px){.navbar.scroll .nav-links{max-width:100%;overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;} .navbar.scroll .nav-links a{flex-shrink:0;white-space:nowrap;}}
</style>
</head>
<body>
<nav class="navbar sticky collapse sticky collapse">
    <input class="navbar-toggle-input" type="checkbox" id="navbar-toggle">
    <div class="navbar-inner">

        <label class="navbar-toggle" for="navbar-toggle" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <div class="nav-links">
    <a href="/">Home</a>
    <a href="/components">Components</a>
    <a href="/pricing">Pricing</a>
    <a href="/about">About</a>
    <a href="/docs">Docs</a>

    {/if}
        </div>
    </div>
</nav>
    <div class="not-found-container">
        <h1 class="glow-code">404</h1>
        <h2>Page Not Found</h2>
        <p>The route you are looking for doesn't exist, has been removed, or is under construction.</p>
        <button type="" class="vlo-btn primary" href="/">Back to Home</button>
    </div>
<div id="__VLO_FLASH_PLACEHOLDER__"></div>
<script>(function(){var p=window.location.pathname;document.querySelectorAll('a[href]').forEach(function(a){var h=a.getAttribute('href');if(!h||h.startsWith('http')||h.startsWith('#')||h.startsWith('javascript'))return;if(h==='/'&&p==='/'){a.classList.add('active')}else if(h!=='/'&&p.startsWith(h)){a.classList.add('active')}})})()</script>
</body>
</html>
