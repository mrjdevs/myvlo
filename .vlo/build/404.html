<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/style.css">

<style>
/* VLO:page */

.not-found-container {
    text-align: center;
    padding: 100px 20px;
    max-width: 600px;
    margin: 0 auto;
}
.glow-code {
    font-size: 7.5rem;
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(135deg, #00f5ff, #00ff88);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 1rem;
    filter: drop-shadow(0 0 25px rgba(0, 245, 255, 0.3));
}
.not-found-container h2 {
    font-size: 2rem;
    color: #fff;
    margin-bottom: 12px;
}
.not-found-container p {
    color: #888;
    margin-bottom: 30px;
    font-size: 1.1rem;
}

/* VLO:Button */
.vlo-btn{background:#00f5ff;color:#000;padding:12px 24px;border-radius:8px;font-weight:bold;border:none;display:inline-block;text-align:center;cursor:pointer;transition:all 0.2s}.vlo-btn:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(0,245,255,.3)}.vlo-btn.secondary{background:transparent;color:#00f5ff;border:2px solid #00f5ff}.vlo-btn.ghost{background:transparent;color:#aaa}
</style>
</head>
<body>
    <div class="not-found-container">
        <h1 class="glow-code">404</h1>
        <h2>Page Not Found</h2>
        <p>The route you are looking for doesn't exist, has been removed, or is under construction.</p>
        <button type="" class="vlo-btn primary" href="/">Back to Home</button>
    </div>
</body>
</html>
